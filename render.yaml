services:
  - type: web
    name: mixiang-hsk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
